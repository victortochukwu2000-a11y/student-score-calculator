<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Score Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Student Score Calculator</h1>
    <p class="hint">CA 1, CA 2 and CA 3 are each out of 10. Exam is out of 70. Total is out of 100.</p>

    <div class="table-wrap">
      <table id="scoreTable">
        <thead>
          <tr>
            <th>Student</th>
            <th>CA 1</th>
            <th>CA 2</th>
            <th>CA 3</th>
            <th>Exam</th>
            <th>Total</th>
            <th>Grade</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Student 1</td>
            <td><input type="number" class="score ca" min="0" max="10" placeholder="0"></td>
            <td><input type="number" class="score ca" min="0" max="10" placeholder="0"></td>
            <td><input type="number" class="score ca" min="0" max="10" placeholder="0"></td>
            <td><input type="number" class="score exam" min="0" max="70" placeholder="0"></td>
            <td class="total">0</td>
            <td class="grade">F</td>
          </tr>
          <tr>
            <td>Student 2</td>
            <td><input type="number" class="score ca" min="0" max="10" placeholder="0"></td>
            <td><input type="number" class="score ca" min="0" max="10" placeholder="0"></td>
            <td><input type="number" class="score ca" min="0" max="10" placeholder="0"></td>
            <td><input type="number" class="score exam" min="0" max="70" placeholder="0"></td>
            <td class="total">0</td>
            <td class="grade">F</td>
          </tr>
          <tr>
            <td>Student 3</td>
            <td><input type="number" class="score ca" min="0" max="10" placeholder="0"></td>
            <td><input type="number" class="score ca" min="0" max="10" placeholder="0"></td>
            <td><input type="number" class="score ca" min="0" max="10" placeholder="0"></td>
            <td><input type="number" class="score exam" min="0" max="70" placeholder="0"></td>
            <td class="total">0</td>
            <td class="grade">F</td>
          </tr>
          <tr>
            <td>Student 4</td>
            <td><input type="number" class="score ca" min="0" max="10" placeholder="0"></td>
            <td><input type="number" class="score ca" min="0" max="10" placeholder="0"></td>
            <td><input type="number" class="score ca" min="0" max="10" placeholder="0"></td>
            <td><input type="number" class="score exam" min="0" max="70" placeholder="0"></td>
            <td class="total">0</td>
            <td class="grade">F</td>
          </tr>
          <tr>
            <td>Student 5</td>
            <td><input type="number" class="score ca" min="0" max="10" placeholder="0"></td>
            <td><input type="number" class="score ca" min="0" max="10" placeholder="0"></td>
            <td><input type="number" class="score ca" min="0" max="10" placeholder="0"></td>
            <td><input type="number" class="score exam" min="0" max="70" placeholder="0"></td>
            <td class="total">0</td>
            <td class="grade">F</td>
          </tr>
        </tbody>
      </table>
    </div>

    <p class="hint">Grading: A 70+, B 60-69, C 50-59, D 45-49, E 40-44, F below 40.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
